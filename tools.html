<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 工具集全景看板 · AI · Radar</title>
<meta name="description" content="按场景分类的 AI 工具集：对话智能体、搜索研究、写作、图像、视频、音频、办公、编程、设计、模型资源、商业与内容安全，共 218 款。">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%235b5bd6'/><circle cx='16' cy='16' r='3' fill='white'/><circle cx='16' cy='16' r='8' fill='none' stroke='white' stroke-opacity='.55' stroke-width='1.6'/><circle cx='16' cy='16' r='13' fill='none' stroke='white' stroke-opacity='.28' stroke-width='1.4'/></svg>">
</head>
<body class="page-tools">

<header class="topbar">
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="2.6" fill="#fff" stroke="none"/>
        <circle cx="12" cy="12" r="6.4" opacity=".7"/>
        <circle cx="12" cy="12" r="10.2" opacity=".38"/>
      </svg>
    </div>
    <div class="brand-text">
      <span class="brand-title">AI · Radar</span>
      <span class="brand-sub">AI 工具集</span>
    </div>
  </div>

  <nav class="page-nav">
    <a href="./index.html">AI 大模型</a>
    <a href="./tools.html" class="on">AI 工具集</a>
  </nav>

  <div class="topbar-spacer"></div>

  <div class="topbar-meta">
    <span id="updatedAt"><span class="dot-live"></span>加载中…</span>
    <a class="btn-ghost" href="https://github.com/rayassassin/llm-radar/issues/new" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      提交工具
    </a>
  </div>
</header>

<div class="shell">

  <section class="hero">
    <div class="hero-eyebrow">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
      AI Tools Directory
    </div>
    <h1>AI 工具集全景看板</h1>
    <p>按真实使用场景归类的 AI 工具清单。从对话智能体到视频生成，从编程助手到内容安全检测，每项只写清它适合干什么。</p>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">收录工具</div>
        <div class="stat-value" id="statTotal">—</div>
        <div class="stat-foot" id="statTotalFoot">覆盖主流 AI 应用</div>
      </div>
      <div class="stat accent-green">
        <div class="stat-label">免费或开源</div>
        <div class="stat-value" id="statFree">—</div>
        <div class="stat-foot">可直接上手，无预算门槛</div>
      </div>
      <div class="stat accent-amber">
        <div class="stat-label">热门推荐</div>
        <div class="stat-value" id="statHot">—</div>
        <div class="stat-foot">各场景下的首选</div>
      </div>
      <div class="stat">
        <div class="stat-label">场景分类</div>
        <div class="stat-value" id="statCat">—</div>
        <div class="stat-foot">按用途而非厂商归类</div>
      </div>
    </div>
  </section>

  <!-- ============ 工具条 ============ -->
  <div class="toolbar">
    <div class="toolbar-row">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="搜索工具名称或用途，如「抠图」「PPT」「配音」" autocomplete="off" spellcheck="false">
      </div>
      <div class="spacer"></div>
      <select class="select" id="sortSelect" title="排序方式">
        <option value="hot">推荐优先</option>
        <option value="pop">流行度优先</option>
        <option value="name">名称 A→Z（中文按拼音）</option>
        <option value="cat">按分类</option>
      </select>
    </div>
    <div class="toolbar-row">
      <div class="chips" id="catChips"></div>
    </div>
    <div class="toolbar-row">
      <div class="chips" id="tagChips"></div>
      <div class="spacer"></div>
      <button class="btn-ghost" id="clearFilters">清空筛选</button>
    </div>
    <div class="active-filters" id="activeFilters"></div>
  </div>

  <div class="result-bar">
    <span class="result-count" id="resultCount">加载中…</span>
    <span class="spacer"></span>
    <span style="font-size:11.5px;color:var(--text-3)">点击卡片直达官网</span>
  </div>

  <section id="hotSection" class="hot-section">
    <div class="section-head">
      <h2>热门推荐</h2>
      <span>各场景下的首选工具</span>
    </div>
    <div class="tool-grid" id="hotGrid"></div>
  </section>

  <section>
    <div class="section-head" id="allHead">
      <h2>全部工具</h2>
      <span id="allHeadNote">点击卡片直达官网</span>
    </div>
    <div class="tool-grid" id="toolGrid"></div>
    <div class="pager" id="pager"></div>
    <div id="emptyState"></div>
  </section>

  <footer class="site-foot">
    <span>数据为人工维护的精选清单，链接指向各工具官网。</span>
    <span>分类口径参考公开 AI 导航站，简介为重新撰写。</span>
  </footer>
</div>

<script src="tools.js"></script>
</body>
</html>
